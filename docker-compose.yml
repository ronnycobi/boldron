# Local dev stack. Postgres is provisioned here so switching DB_ENGINE=postgres
# needs no extra setup; the backend still defaults to SQLite until you do.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: boldron
      POSTGRES_USER: boldron
      POSTGRES_PASSWORD: boldron
    ports:
      - "5432:5432"
    volumes:
      - boldron_pgdata:/var/lib/postgresql/data

  backend:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_DEBUG: "true"
      DB_ENGINE: postgres
      DB_HOST: db
      DB_NAME: boldron
      DB_USER: boldron
      DB_PASSWORD: boldron
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  boldron_pgdata:
