{% extends "dashboard/auth_base.html" %}
{% block title %}Password updated · {{ app_name }}{% endblock %}
{% block auth %}
  <h1 class="title">Password updated</h1>
  <div class="ok">Your password has been changed. You can now sign in with your new password.</div>
  <form method="get" action="{% url 'dashboard:login' %}"><button type="submit">Go to sign in →</button></form>
{% endblock %}
