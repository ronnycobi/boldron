{% if u.avatar_url %}<span class="avatar" style="width:{{ size|default:30 }}px;height:{{ size|default:30 }}px;background:none;padding:0;overflow:hidden"><img src="{{ u.avatar_url }}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></span>{% else %}<span class="avatar" style="width:{{ size|default:30 }}px;height:{{ size|default:30 }}px;font-size:{{ font|default:12 }}px">{{ u.initials }}</span>{% endif %}
