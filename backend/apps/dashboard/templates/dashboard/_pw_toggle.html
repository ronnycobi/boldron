<script>
/* Eye-icon show/hide toggle for every password field. No dependencies. */
(function () {
  var EYE =
    '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
  var EYE_OFF =
    '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M17.9 17.9A10.5 10.5 0 0 1 12 19C5.5 19 2 12 2 12a18 18 0 0 1 4.1-5.1"/>' +
    '<path d="M9.9 4.2A9.5 9.5 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-2.2 3.2"/>' +
    '<path d="M9.5 9.5a3 3 0 0 0 4 4"/><path d="M2 2l20 20"/></svg>';

  document.querySelectorAll('input[type="password"]').forEach(function (inp) {
    if (inp.dataset.pwToggle) return;
    inp.dataset.pwToggle = "1";
    var wrap = document.createElement("span");
    wrap.style.cssText = "position:relative;display:block";
    inp.parentNode.insertBefore(wrap, inp);
    wrap.appendChild(inp);
    inp.style.paddingRight = "42px";
    var btn = document.createElement("button");
    btn.type = "button";
    btn.innerHTML = EYE;
    btn.setAttribute("aria-label", "Show password");
    btn.style.cssText =
      "position:absolute;right:8px;top:50%;transform:translateY(-50%);" +
      "display:inline-flex;align-items:center;justify-content:center;" +
      "background:none;border:0;color:#8a93ad;cursor:pointer;padding:4px;" +
      "width:auto;margin:0;box-shadow:none;line-height:0";
    btn.onmouseenter = function () { btn.style.color = "#e8edfb"; };
    btn.onmouseleave = function () { btn.style.color = "#8a93ad"; };
    btn.addEventListener("click", function () {
      var hidden = inp.type === "password";
      inp.type = hidden ? "text" : "password";
      btn.innerHTML = hidden ? EYE_OFF : EYE;
      btn.setAttribute("aria-label", (hidden ? "Hide" : "Show") + " password");
      inp.focus();
    });
    wrap.appendChild(btn);
  });
})();
</script>
